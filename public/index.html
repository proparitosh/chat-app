<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chatify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="ui.css" />
</head>

<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden">

<!-- LOGIN -->
<section id="loginView" class="h-screen flex items-center justify-center">
  <form id="loginForm" class="bg-gray-800 p-8 rounded-xl w-full max-w-md space-y-6 shadow-lg">
    <h1 class="text-3xl font-bold text-center">Chatify</h1>
    <input id="usernameInput"
      class="w-full p-3 rounded bg-gray-900 border border-gray-700 focus:ring-2 focus:ring-blue-500"
      placeholder="Choose username"
      required />
    <button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold">
      Enter Chat
    </button>
  </form>
</section>

<!-- CHAT -->
<section id="chatView" class="hidden h-screen flex">

  <!-- SIDEBAR -->
  <aside class="w-72 bg-gray-800 border-r border-gray-700 flex flex-col">
    <header class="p-4 font-bold text-xl flex justify-between">
      Rooms
      <button id="openRoomModal">+</button>
    </header>

    <div id="roomList" class="flex-1 overflow-y-auto p-2 space-y-2"></div>

    <footer class="p-4 border-t border-gray-700 flex justify-between items-center">
      <span id="currentUser"></span>
      <button id="logoutBtn" class="text-red-400">Logout</button>
    </footer>
  </aside>

  <!-- CHAT AREA -->
  <main class="flex-1 flex flex-col">

    <header class="h-14 bg-gray-800 border-b border-gray-700 flex items-center px-4">
      <h2 id="activeRoom" class="font-bold text-lg">Select a room</h2>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <form id="messageForm" class="p-4 bg-gray-800 border-t border-gray-700 hidden">
      <div class="flex gap-2">
        <input id="messageInput"
          class="flex-1 p-3 rounded bg-gray-700 focus:ring-2 focus:ring-blue-500"
          placeholder="Type a message..." />
        <button class="bg-blue-600 px-6 rounded">Send</button>
      </div>
    </form>

  </main>
</section>

<!-- CREATE ROOM MODAL -->
<div id="roomModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
  <form id="roomForm" class="bg-gray-800 p-6 rounded-xl w-full max-w-sm space-y-4">
    <h3 class="text-xl font-bold">Create Room</h3>
    <input id="roomInput"
      class="w-full p-3 rounded bg-gray-900 border border-gray-700"
      placeholder="Room name"
      required />
    <div class="flex justify-end gap-2">
      <button type="button" id="closeRoomModal">Cancel</button>
      <button class="bg-blue-600 px-4 py-2 rounded">Create</button>
    </div>
  </form>
</div>

<script src="app.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
